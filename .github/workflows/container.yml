name: Container deployment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, boot and recreate the Linux image
        run: python3 scripts/check-deployment.py
